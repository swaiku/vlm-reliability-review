[project]
name = "vlm-reliability-experiments"
version = "0.1.0"
description = "One VLM (via Ollama) against one specialist per task: presence, localization, counting"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "pyyaml",
    "tqdm",
    "pillow",
    "torch",
    "torchvision",
    "transformers<5",
    "ultralytics",
    "scipy>=1.17.1",
    "addict>=2.4.0",
    "yapf==0.40.1",
    "timm>=1.0.31",
    "pycocotools>=2.0.11",
    "termcolor>=3.3.0",
    "colorlog>=6.12.0",
]

[dependency-groups]
dev = ["ruff", "jupyter", "pandas", "matplotlib"]

# AMD GPU (ROCm): torch and torchvision come from the PyTorch ROCm index
[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm10.0"
# not explicit: torch 2.15+rocm10.0 needs rocm / rocm-sdk-* wheels that only live on this index

[tool.uv]
# shortcut: the ROCm wheels exist for Linux x86_64 only; resolving other platforms stalls `uv lock`
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
